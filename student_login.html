<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNM: :College automation System</title>
    <link rel="stylesheet" href="./css/bootstrap.css">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- custom css -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- swipper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

</head>

<body class="admin">
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-12 mt-5">
                <div class="row">
                    <div class="col-sm-4 mx-auto my-5 card">
                        <div class="mt-5  text-center">
                            <img src="./images/logo1.png" class="img-fluid">
                            <p>Badri Narayan Mukteshwar College, Barhiya <br>
                                CAS (College ERP)</p>
                        </div>

                        <form class=" py-5">
                            <div class="row">
                                <div class="col-sm-10 mx-auto">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <label for="user" class=" fs-5">Roll No/Enrl. No./Form Id</label>
                                            <input type="text" id="user" class="form-control bg-light "
                                                placeholder="Enter username">
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-sm-12 mx-auto pt-4">
                                            <div>
                                                <label for="pass" class=" fs-5">Password</label>
                                                <input type="text" id="pass" class="form-control bg-light "
                                                    placeholder="Enter password">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mt-5">
                                        <div class="col-sm-12">
                                            <button class="btn btn-primary ">Login → </button>
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <div class="col-sm-12">
                                            <a href="clgautosys.html" class="text-decoration-none"> Back to Home</a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./js/bootstrap.bundle.js"></script>
</body>

</html>
